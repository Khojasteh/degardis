trigger: >-
  Two facets have the same title, compared without regard to case.
impact: >-
  The index never repeats a facet's contents, so the title and its optional description are the whole of what a reader decides from. Two identical rows cannot be told apart, and the reader either loads both or guesses.
resolution: >-
  Give each facet a title that tells it apart from the others, since the
  title is what the reader chooses by.
