trigger: >-
  The manifest declares a source format_version older than this installed
  compiler reads ({{format_version}}).
impact: >-
  An earlier format's sources never carried the typed inputs, declared
  outcomes, gates, and graph edges this one validates, so they are not
  derivable from it. The source should be rewritten.
failing: |-
  format_version: {{older_format_version}}
passing: |-
  format_version: {{format_version}}
