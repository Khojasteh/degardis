trigger: >-
  The manifest declares a source format_version newer than this installed
  compiler reads.
impact: >-
  The source was written for a later compiler. Install a newer degardis
  release to read it; this one would apply the wrong rules to fields this
  version does not know.
failing: |-
  format_version: {{newer_format_version}}
passing: |-
  format_version: {{format_version}}
