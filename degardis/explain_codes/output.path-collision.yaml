trigger: >-
  Two files the source supplies would be written to the same path in the bundle, one of them would be written over `SKILL.md` or `agents/openai.yaml`, a selected file's directory differs only in letter case from another directory the bundle writes, or one path would be both a file and a directory.
impact: >-
  One would overwrite the other, or the build cannot write the bundle, and what results depends on the filesystem. Tasks, principles, guides, facets, scripts, and assets all claim paths in one namespace, so an asset selected from under `references/tasks/` can land on a generated task page, and one under `References/` lands beside the generated pages on one host and in their directory on another.
resolution: >-
  Rename or deselect one of the two sources, so every output path and directory has one owner and one spelling.
