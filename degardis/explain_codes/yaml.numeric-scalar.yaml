trigger: >-
  An unquoted value is a number whose text does not survive loading: a
  leading zero, or a decimal with a trailing zero.
impact: >-
  The generated skill shows the number YAML built, not the one the file
  holds: 007 becomes 7 and 1.10 becomes 1.1.
failing: |-
  version: 1.10
passing: |-
  version: "1.10"
