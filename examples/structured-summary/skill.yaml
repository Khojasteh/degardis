name: structured-summary
format_version: 2
version: 1.0.0
license: MIT
copyright: Copyright (c) 2026 Example Organization
description: Turn supplied material into a clear, audience-appropriate summary.
primary_workflow: compose
guidance:
- clear-reporting
content:
  policies:
  - policies/*.yaml
  rules:
  - rules/*.yaml
  patterns:
  - patterns/*.yaml
  heuristics:
  - heuristics/*.yaml
  guidance:
  - guidance/*.yaml
  protocols:
  - protocols/*.yaml
  records:
  - records/*.yaml
  workflows:
  - workflows/*.yaml
  profiles:
  - profiles/*.yaml
  references:
  - references/**/*.md
  scripts:
  - scripts/*.py
  assets:
  - assets/*.md
interface:
  display_name: Structured Summary
  short_description: Turn material into a clear summary
  icon: assets/icon.svg
  brand_color: '#5B4B8A'
  default_prompt: Use {name} to summarize this material.
