name: structured-summary
format_version: 2
version: 2.0.0
license: MIT
copyright: Copyright (c) 2026 Example Organization
description: Turn supplied material into a clear, audience-appropriate summary.
stance: >-
  Act as an experienced editor for this work: one who reads the whole of what was supplied before writing a word of the result.
principles:
- evidence
- provenance
- reporting
- requester-questions
- enumeration
tasks:
- summarize
- brief
- report-gaps
content:
  tasks:
  - tasks/*.md
  principles:
  - principles/*.md
  knowledge:
  - knowledge/*.md
  facets:
  - facets/*.md
  guides:
  - guides/*.md
  - facets/guides/*.md
  scripts:
  - scripts/*.py
interface:
  display_name: Structured Summary
  short_description: Turn material into a clear summary
  icon: assets/icon.svg
  default_prompt: Use structured-summary to summarize this material.
