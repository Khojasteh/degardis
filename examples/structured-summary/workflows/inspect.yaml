id: structured-summary.inspect
title: Inspect the supplied material
description: Establish the material's structure and evidence boundaries before summarizing it.
steps:
- action: inventory
  instruction: Identify the material's subject, sections, main claims, examples, conclusions, and explicit uncertainties.
- action: outline
  instruction: For Markdown input, optionally run scripts/list_headings.py to expose its section structure.
- action: flag-gaps
  instruction: Identify missing context or contradictions that prevent a reliable summary and present them as limitations.
