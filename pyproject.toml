[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "degardis"
dynamic = ["version"]
description = "Compile validated Agent Skill sources into portable, installable bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kambiz Khojasteh" },
]
keywords = [
    "agent-skills",
    "ai-agents",
    "cli",
    "compiler",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "Pillow>=10,<13",
    "PyYAML>=6.0",
    "resvg_py>=0.3,<1.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.14,<0.15",
]
release = [
    "build>=1.2",
    "twine>=6",
]

[project.urls]
Documentation = "https://github.com/Khojasteh/degardis/tree/main/docs"
Issues = "https://github.com/Khojasteh/degardis/issues"
Repository = "https://github.com/Khojasteh/degardis"

[project.scripts]
degardis = "degardis.cli:main"

[tool.ruff]
# The language floor the package supports, not the interpreter that happens to
# run the check.
target-version = "py310"

[tool.ruff.lint]
# Errors and bug patterns only. Formatting stays unenforced, as AGENTS.md says:
# match the surrounding file's wrapping and layout.
select = [
    "E4",   # imports
    "E7",   # statement-level mistakes
    "E9",   # syntax and IO errors
    "F",    # pyflakes: undefined names, unused imports and variables
    "B",    # bugbear: mutable defaults, shadowed loop variables, silent bugs
    "C4",   # needless comprehensions
    "PIE",  # unnecessary code
    "RSE",  # raise statements
    "RUF",  # ruff's own checks
    "UP",   # constructs superseded on the supported Python versions
]
ignore = [
    # zip() without strict= is not a style problem: choosing True changes what
    # happens on unequal lengths, and choosing False only restates today's
    # behavior. Decide it per call site, not by lint.
    "B905",
]

[tool.setuptools]
packages = ["degardis"]

[tool.setuptools.dynamic]
version = { attr = "degardis.__version__" }
