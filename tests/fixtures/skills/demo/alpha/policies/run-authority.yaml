title: Run authority
summary: Keep every external effect inside established authority.
provisions:
  establish-authority:
    phase: before
    match:
      effects: [external.*]
    require: Establish the authority for the external effect before taking it.
    verify:
      gate: authorization
  no-inferred-benefit:
    phase: during
    match:
      effects: [external.*]
    prohibit: Treat inferred benefit as authority for the effect.
  report-effect:
    phase: after
    match:
      effects: [external.*]
    require: Report the external effect and the authority you used.
  report-boundary:
    phase: before-return
    match:
      forms: [return]
    require: Report the boundary of what this run covered.
