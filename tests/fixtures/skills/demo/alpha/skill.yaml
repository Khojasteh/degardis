name: alpha
format_version: 2
version: 1.0.0
license: MIT
copyright: Copyright (c) 2026 Alpha
description: Carry every construct kind this format defines, in one source.
purpose: >-
  Exercise the compiler: three tasks, skill-wide principles, knowledge of every
  kind, a requirement chain, facets in two categories that name guides of their
  own, and guides alongside scripts and assets.
principles:
- evidence
- expenditure
- reporting
- delegation
- provenance
tasks:
- review
- repair
- document
content:
  tasks:
  - tasks/*.md
  principles:
  - principles/*.md
  knowledge:
  - knowledge/*.md
  facets:
  - facets/*.md
  guides:
  - guides/*.md
  scripts:
  - scripts/*.py
  assets:
  - assets/*.md
interface:
  display_name: Alpha
  short_description: Carry every construct kind
  brand_color: '#123456'
  default_prompt: Use {name} to exercise the compiler.
