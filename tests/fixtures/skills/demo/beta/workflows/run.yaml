title: Run once
description: Do the one thing this skill does, and return.
inputs:
  subject:
    type: string
outcomes:
  done:
    record: note
entry: act
steps:
  act:
    action: Do the one thing this skill does.
    uses: [input.subject]
    produces:
      note:
        type: string
    next: finish

  finish:
    return:
      outcome: done
      with:
        text: {from: result.note}
