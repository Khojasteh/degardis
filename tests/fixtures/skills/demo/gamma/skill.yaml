name: gamma
title: Gamma
format_version: 1
version: 1.0.0
description: Gamma is a minimal self-contained fixture skill used to exercise
  independent artifact generation in tests.
primary_workflow: gamma.run
content:
  entries:
  - entries/*.yaml
  workflows:
  - workflows/*.yaml
profiles:
  directory: profiles
  defaults: []
interface:
  display_name: Gamma
  short_description: Minimal fixture skill depending on beta and alpha
  default_prompt: Use $gamma to run the fixture workflow.
